name: Сборка и Релиз akstOS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: i686-unknown-linux-musl
            arch_name: 32bit-ancient-x86
            apt_pkg: gcc-multilib musl-tools
          - target: x86_64-unknown-linux-musl
            arch_name: 64bit-modern-x86_64
            apt_pkg: musl-tools

    steps:
    - name: Получение исходников
      uses: actions/checkout@v4

    - name: Установка Rust (${{ matrix.target }})
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Установка инструментов
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.apt_pkg }} cpio gzip

    - name: Компиляция akstOS PID 1 (${{ matrix.arch_name }})
      run: |
        cargo build --release --target ${{ matrix.target }}

    - name: Упаковка файловой системы initramfs
      run: |
        mkdir -p rootfs/{bin,sbin,etc,proc,sys,dev,tmp,run,home/student}
        cp target/${{ matrix.target }}/release/akst_os rootfs/init
        chmod +x rootfs/init
        cp config/os-release rootfs/etc/os-release

        cd rootfs
        find . -print0 | cpio --null -ov --format=newc | gzip -9 > ../akstOS-${{ matrix.arch_name }}.cpio.gz
        cd ..

    - name: Сохранение артефакта
      uses: actions/upload-artifact@v4
      with:
        name: akstOS-${{ matrix.arch_name }}-boot-image
        path: akstOS-${{ matrix.arch_name }}.cpio.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Скачивание всех артефактов
      uses: actions/download-artifact@v4

    - name: Публикация релиза с прямыми ссылками
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "akstOS Релиз (Готовые образы для колледжа)"
        body: |
          ### Готовые образы akstOS для старых компьютеров
          - **akstOS-32bit-ancient-x86.cpio.gz**: Для 32-битных древних процессоров (Pentium 3/4, Celeron).
          - **akstOS-64bit-modern-x86_64.cpio.gz**: Для 64-битных ПК.
          
          В системе встроен мастер установки на диск (команда `установить`).
        files: |
          akstOS-32bit-ancient-x86-boot-image/akstOS-32bit-ancient-x86.cpio.gz
          akstOS-64bit-modern-x86_64-boot-image/akstOS-64bit-modern-x86_64.cpio.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
