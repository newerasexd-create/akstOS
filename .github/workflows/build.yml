name: Сборка загрузочного ISO akstOS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch_name: 64bit
            kernel_url: https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/netboot/vmlinuz-lts
            apt_pkg: musl-tools
          - target: i686-unknown-linux-gnu
            arch_name: 32bit-ancient
            kernel_url: https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86/netboot/vmlinuz-lts
            apt_pkg: gcc-multilib libc6-dev-i386

    steps:
    - name: Получение исходников
      uses: actions/checkout@v4

    - name: Установка Rust (${{ matrix.target }})
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Установка инструментов создания ISO
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.apt_pkg }} cpio gzip xorriso isolinux syslinux-common syslinux-utils curl

    - name: Компиляция akstOS PID 1 (${{ matrix.arch_name }})
      run: |
        cargo build --release --target ${{ matrix.target }}

    - name: Создание структуры initramfs
      run: |
        mkdir -p rootfs/{bin,sbin,etc,proc,sys,dev,tmp,run,home/student}
        cp target/${{ matrix.target }}/release/akst_os rootfs/init
        chmod +x rootfs/init
        cp config/os-release rootfs/etc/os-release

        cd rootfs
        find . -print0 | cpio --null -ov --format=newc | gzip -9 > ../initramfs.cpio.gz
        cd ..

    - name: Сборка гибридного загрузочного ISO (с правильным ядром Linux)
      run: |
        mkdir -p isodir/{boot,isolinux}
        cp initramfs.cpio.gz isodir/boot/initramfs.cpio.gz

        # Скачиваем настоящее ядро нужной архитектуры (32-бит или 64-бит)
        echo "Скачивание ядра: ${{ matrix.kernel_url }}"
        curl -s -L -o isodir/boot/vmlinuz ${{ matrix.kernel_url }}
        chmod 644 isodir/boot/vmlinuz
        ls -lh isodir/boot/vmlinuz

        # Копируем компоненты загрузчика ISOLINUX
        cp /usr/lib/ISOLINUX/isolinux.bin isodir/isolinux/isolinux.bin
        cp /usr/lib/syslinux/modules/bios/ldlinux.c32 isodir/isolinux/ldlinux.c32 || true
        cp /usr/lib/syslinux/modules/bios/libutil.c32 isodir/isolinux/libutil.c32 || true
        cp /usr/lib/syslinux/modules/bios/menu.c32 isodir/isolinux/menu.c32 || true

        # Конфигурация загрузчика
        cat << 'EOF' > isodir/isolinux/isolinux.cfg
        DEFAULT akstOS
        PROMPT 0
        TIMEOUT 30

        LABEL akstOS
          MENU LABEL akstOS College Edition (Liquid Glass)
          LINUX /boot/vmlinuz
          INITRD /boot/initramfs.cpio.gz
          APPEND nomodeset vga=791 console=tty0 quiet
        EOF

        # Создаем гибридный образ ISO
        xorriso -as mkisofs \
          -r -V "akstOS" \
          -J -joliet-long \
          -b isolinux/isolinux.bin \
          -c isolinux/boot.cat \
          -no-emul-boot \
          -boot-load-size 4 \
          -boot-info-table \
          -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
          -o akstOS-${{ matrix.arch_name }}.iso isodir

        ls -lh akstOS-${{ matrix.arch_name }}.iso

    - name: Сохранение ISO как артефакта
      uses: actions/upload-artifact@v4
      with:
        name: akstOS-${{ matrix.arch_name }}-iso
        path: akstOS-${{ matrix.arch_name }}.iso

  publish-release:
    needs: build-iso
    runs-on: ubuntu-latest
    steps:
    - name: Скачивание всех собранных ISO
      uses: actions/download-artifact@v4

    - name: Список скачанных файлов
      run: |
        mkdir -p release_assets
        find . -name "*.iso" -exec cp {} release_assets/ \;
        ls -lh release_assets/

    - name: Публикация релиза v1.0 с правильными ядрами
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0
        name: "akstOS v1.0 (Загрузочные ISO с 32-бит и 64-бит ядрами)"
        body: |
          ### Официальные гибридные ISO образы akstOS
          
          - **akstOS-32bit-ancient.iso** (настоящее 32-битное ядро i686): заводится на абсолютно любых 32-битных процессорах (Pentium 2/3/4, Celeron) и 32-битных виртуалках!
          - **akstOS-64bit.iso** (настоящее 64-битное ядро x86-64): для всех 64-битных ПК.
        files: |
          release_assets/*.iso
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
